<!-- Text drawn as SVG with embedded JetBrains Mono (OFL) -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="420" height="228" viewBox="0 0 420 228" role="img" aria-label="Hi, I'm Black Cat. Life goes on, and so does the struggle. A tinkerer at heart — gadgets, operating systems, terminals, AI. If it has a computer inside, I want to take it apart. I love version updates. Every iteration feels like a rebirth.">
  <defs>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400;
        font-display: fallback;
        src: url(data:font/truetype;base64,) format('truetype');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 700;
        font-display: fallback;
        src: url(data:font/truetype;base64,) format('truetype');
      }
      .h     { fill: #2563eb; }
      .para1 { fill: #7c3aed; }
      .para2 { fill: #0f766e; }
      .cursor { fill: #5b8def; opacity: 0; animation: blink 1s steps(1) infinite 0.4s; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-color-scheme: dark) {
        .h     { fill: #7aa7ff; }
        .para1 { fill: #c4b5fd; }
        .para2 { fill: #5eead4; }
        .cursor { fill: #7aa7ff; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; opacity: 1; }
      }
    </style>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="330" y2="0">
      <stop offset="0"    stop-color="#5B8DEF"/>
      <stop offset="0.2"  stop-color="#7C5CFF"/>
      <stop offset="0.4"  stop-color="#EC4899"/>
      <stop offset="0.6"  stop-color="#F97316"/>
      <stop offset="0.8"  stop-color="#22C55E"/>
      <stop offset="1"    stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <text class="h" x="0" y="26" font-size="20" font-weight="700"
        font-family="'JetBrains Mono', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', monospace">Hi, I'm Black Cat 🐈‍⬛</text>

  <path id="tp1" d="M0,62 h0">
    <animate id="a1" attributeName="d" begin="0.4s" dur="2.2s" fill="freeze"
             values="M0,62 h0;M0,62 h156"/>
  </path>
  <path id="tp2" d="M0,94 h0">
    <animate id="a2" attributeName="d" begin="a1.end" dur="2.5s" fill="freeze"
             values="M0,94 h0;M0,94 h300"/>
  </path>

  <text font-family="'JetBrains Mono', monospace" font-size="20" fill="url(#rainbow)">
    <textPath xlink:href="#tp1" href="#tp1">Life goes on,</textPath>
  </text>
  <text font-family="'JetBrains Mono', monospace" font-size="20" fill="url(#rainbow)">
    <textPath xlink:href="#tp2" href="#tp2">and so does the struggle.</textPath>
  </text>

  <rect class="cursor" x="0" y="44" width="2.5" height="22" rx="1">
    <animate attributeName="x" begin="0.4s" dur="2.2s" fill="freeze" values="0;156"/>
    <set attributeName="y" to="76" begin="a1.end"/>
    <animate attributeName="x" begin="a1.end" dur="2.5s" fill="freeze" values="0;300"/>
  </rect>

    <text class="para1" x="0" y="128" font-family="'JetBrains Mono', monospace" font-size="14.5">A tinkerer at heart — gadgets, operating</text>
    <text class="para1" x="0" y="147.5" font-family="'JetBrains Mono', monospace" font-size="14.5">systems, terminals, AI. If it has a computer</text>
    <text class="para1" x="0" y="167" font-family="'JetBrains Mono', monospace" font-size="14.5">inside, I want to take it apart.</text>

    <text class="para2" x="0" y="196.5" font-family="'JetBrains Mono', monospace" font-size="14.5">I love version updates. Every iteration feels</text>
    <text class="para2" x="0" y="216" font-family="'JetBrains Mono', monospace" font-size="14.5">like a rebirth.</text>
</svg>
